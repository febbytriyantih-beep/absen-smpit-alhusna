<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Guru & Tendik - SMPIT Al-Husna</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>:root{--blue:#252b86;--blue2:#3e49a9;--yellow:#ffe500;--bg:#f4f7fb;--text:#182033;--muted:#667085;--line:#e4e8f0;--red:#9b1c1c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid var(--yellow)}h1{font-size:20px;margin:0}.sub{opacity:.85;font-size:13px;margin-top:3px}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 22px #16224a12;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}h2{margin:0 0 14px}input,select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;margin:6px 0 10px}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}button.alt{background:#eef1ff;color:var(--blue)}button.warn{background:var(--yellow);color:#222}button.danger{background:#fff0f0;color:var(--red)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left}.table-wrap{overflow:auto}.result{padding:14px;border-radius:12px;background:#f6f8fc;margin-top:12px}.ok{background:#eaf9ef;color:#146c32}.bad{background:#fff0f0;color:var(--red)}.small{font-size:12px;color:var(--muted)}.qr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.qr-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;break-inside:avoid}.qr-box{display:flex;justify-content:center;margin:8px 0}.qr-name{font-weight:800;font-size:15px}.qr-meta{font-size:12px;color:var(--muted)}.qr-id{font-size:10px;color:#555;word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:1fr}.qr-grid{grid-template-columns:repeat(2,1fr)}}@media print{header,.no-print{display:none!important}.wrap{max-width:none;padding:0}.qr-grid{grid-template-columns:repeat(3,1fr)}.qr-card{border:1px solid #bbb}.qr-box img{width:150px!important;height:150px!important}}</style></head><body><header><img class="logo" src="logo.jpg"><div><h1>DATA GURU & TENDIK SMPIT AL-HUSNA</h1><div class="sub">Tahun Pelajaran 2026/2027 • QR Attendance</div></div></header><div class="wrap"><div class="card no-print"><button onclick="location.href='index.html'">← Kembali ke Absensi</button></div><div class="grid"><div class="card no-print"><h2>👩‍🏫 Tambah Guru / Tendik</h2><p class="small">Data disimpan di browser ini. QR ID dibuat otomatis dari NIP/ID.</p><label>NIP / ID Pegawai</label><input id="nip" placeholder="Contoh: 198501012010011001"><label>Nama Lengkap</label><input id="nama" placeholder="Nama guru/tendik"><label>Jabatan</label><input id="jabatan" placeholder="Guru Matematika / TU / Kepala Sekolah"><label>QR ID</label><input id="qr" placeholder="Otomatis dari NIP/ID"><div><button onclick="saveGuru()">💾 Simpan Guru/Tendik</button> <button class="alt" onclick="clearForm()">Bersihkan</button></div><div id="msg"></div></div><div class="card"><h2>📋 Data Guru & Tendik</h2><div class="table-wrap"><table><thead><tr><th>NIP/ID</th><th>Nama</th><th>Jabatan</th><th>QR ID</th><th>Aksi</th></tr></thead><tbody id="body"></tbody></table></div></div></div><div class="card no-print"><h2>🪪 Cetak QR Guru & Tendik</h2><button onclick="generateQR()">Buat QR</button> <button class="warn" onclick="window.print()">🖨️ Cetak Semua</button><div id="info" class="result"></div></div><div class="card"><div id="grid" class="qr-grid"></div></div></div><script>function data(){try{return JSON.parse(localStorage.getItem('alhusna_guru')||'[]')}catch(e){return []}}function saveGuru(){const n=nip.value.trim(),nm=nama.value.trim(),j=jabatan.value.trim(),q=qr.value.trim()||('SMPHUSNA-GURU-'+n);if(!n||!nm||!j){msg.innerHTML='<div class="result bad">NIP/ID, nama dan jabatan wajib diisi.</div>';return}let d=data();if(d.some(x=>String(x.nip)===n)){msg.innerHTML='<div class="result bad">NIP/ID sudah terdaftar.</div>';return}d.push({nip:n,nama:nm,jabatan:j,qr:q});localStorage.setItem('alhusna_guru',JSON.stringify(d));render();generateQR();msg.innerHTML='<div class="result ok">Guru/Tendik berhasil ditambahkan. QR ID: <b>'+esc(q)+'</b></div>';clearForm(false)}function clearForm(m=true){nip.value='';nama.value='';jabatan.value='';qr.value='';if(m)msg.innerHTML=''}function render(){const d=data();body.innerHTML=d.length?d.map((x,i)=>'<tr><td>'+esc(x.nip)+'</td><td>'+esc(x.nama)+'</td><td>'+esc(x.jabatan)+'</td><td>'+esc(x.qr)+'</td><td><button class="danger" onclick="del('+i+')">Hapus</button></td></tr>').join(''):'<tr><td colspan="5" class="small">Belum ada data Guru/Tendik.</td></tr>'}function del(i){if(!confirm('Hapus data Guru/Tendik ini?'))return;let d=data();d.splice(i,1);localStorage.setItem('alhusna_guru',JSON.stringify(d));render();generateQR()}function generateQR(){const g=grid;g.innerHTML='';const d=data();d.forEach(x=>{const c=document.createElement('div');c.className='qr-card';c.innerHTML='<div class="qr-name">'+esc(x.nama)+'</div><div class="qr-meta">'+esc(x.jabatan)+' • '+esc(x.nip)+'</div>';const b=document.createElement('div');b.className='qr-box';c.appendChild(b);c.insertAdjacentHTML('beforeend','<div class="qr-id">'+esc(x.qr)+'</div>');g.appendChild(c);new QRCode(b,{text:x.qr,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})});info.className='result ok';info.textContent=d.length+' QR Guru/Tendik berhasil dibuat.'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}document.addEventListener('DOMContentLoaded',()=>{render();generateQR()})</script></body></html>
